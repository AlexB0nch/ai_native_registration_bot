# Тексты бота. Тон — CLAUDE.md: на «вы», спокойно и конкретно, не больше одного эмодзи.
#
# Даты, время, цены и ссылки здесь НЕ пишутся — только подстановки из config/facts.yaml:
#   {author_name} {author_name_genitive} {author_role} {author_telegram} {channel_url}
#   {practicum_title} {practicum_slot} {practicum_date} {practicum_date_short} {practicum_time}
#   {platform} {practicum_case}
#   {course_title} {course_dates} {course_time} {course_start_date} {sessions_count} {session_hours}
#   {demo_day_slot} {demo_day_date_short} {course_format} {course_format_list}
#   {price_early} {price_standard} {price_pro} {early_until} {pro_max_seats}
#   {early_name} {standard_name} {pro_name} {early_includes} {standard_includes} {pro_includes}
#   {course_page} {gift_bot} {gift_after_practicum} {privacy_url}
# Остальные {поля} передаются в t(key, поле=...). Буквальные фигурные скобки — {{ и }}.
# Ключи — путь через точку: t("menu.practicum").

welcome: |-
  Здравствуйте! Я бот {author_name_genitive}, консультанта по операционным трансформациям.
  Запишу вас на бесплатный практикум {practicum_date_short}, расскажу о курсе «{course_title}» и передам Александру ваш вопрос.

menu:
  title: Выберите, что вас интересует.
  practicum: Записаться на практикум {practicum_date_short}
  course: Что будет на курсе
  prices: Цены и формат
  question: Задать вопрос

buttons:
  course_page: Страница курса
  practicum: Записаться на практикум {practicum_date_short}
  menu: В меню

course_about: |-
  Курс «{course_title}»

  {sessions_count} занятия по {session_hours} часа по субботам: {course_dates}, {course_time}. Демо-день — {demo_day_slot}.

  Что делаем:
  1. AI-native консультант. Где ИИ даёт эффект в проекте, а где опасен; постановка задачи и проверка источников.
  2. Аналитика, документы и клиентские материалы. Excel, интервью, управленческая история на нескольких слайдах.
  3. Память проекта и вайбкодинг. README, журнал решений, GitHub, спецификация и backlog MVP.
  4. Инструменты для клиента. AI-версии A3, 5 Why, Gemba и трекера инициатив; сборка MVP, план пилота и питч.

  На демо-дне участники показывают свои MVP.

  С чем закончите: AI Project Brief, библиотека промптов и шаблонов, проектная память в GitHub, спецификация и прототип клиентского инструмента, с которым можно идти к клиенту. Программировать уметь не нужно.

prices: |-
  Тарифы курса «{course_title}»

  {early_name} — {price_early}
  {early_includes}
  Действует до {early_until}.

  {standard_name} — {price_standard}
  {standard_includes}

  {pro_name} — {price_pro}
  {pro_includes}
  Не более {pro_max_seats} мест.

  Оплата через ЮKassa после подтверждения участия.

  Формат: {course_format}. Занятия по субботам: {course_dates}, {course_time}.

course_soon: |-
  Запись на курс откроется скоро. Пока можно прийти на бесплатный практикум {practicum_date_short} — на нём Александр расскажет, как устроен курс.

whoami: "Ваш chat_id: {chat_id}"

# Ответ на сообщение без текста и на неизвестную команду или кнопку.
fallback_text: Выберите действие в меню или нажмите «Задать вопрос».

# Описание бота в Telegram: description ≤ 512 символов, short_description ≤ 120.
description: |-
  Бот {author_name_genitive}. Запишет на бесплатный практикум {practicum_date_short} ({practicum_time}) и расскажет о курсе «{course_title}»: программа, даты, цены и формат. Если готового ответа нет, передаст ваш вопрос Александру — он ответит здесь же.
short_description: Запись на бесплатный практикум {practicum_date_short} и на курс по ИИ для консультантов. Ответы на вопросы о курсе.

commands:
  start: Главное меню
  practicum: Записаться на практикум
  course: Что будет на курсе
  question: Задать вопрос
  stats: Статистика записей
  export: Выгрузка записей (CSV)
  link: Ссылка на практикум
  whoami: Мой chat_id

# Названия событий в таблице events (синхронизация из facts.yaml).
events:
  course_session: "{course_title}: занятие {n}"
  demo_day: "{course_title}: демо-день"
  waitlist: Лист ожидания следующего потока

# --- practicum.* — TASK-BOT-001 ----------------------------------------------------------------
# Подстановки сценария (передаются в t()): {name} {email} {phone} {username} {source} {count} {title}.

practicum:
  ask_name: Как к вам обращаться?
  ask_name_known: Как к вам обращаться? Нажмите «Да, {name}» или напишите, как вас зовут.
  name_invalid: Напишите, пожалуйста, только имя — до 100 символов, без ссылок.
  ask_email: Ваша почта — на случай, если Telegram подведёт.
  email_invalid: "Похоже, в адресе опечатка. Пример: name@company.ru"
  ask_phone: |-
    Телефон — по желанию. Нажмите «Поделиться контактом» внизу, напишите номер или нажмите «Пропустить».
  phone_nav: Можно вернуться к почте или отменить запись.
  phone_invalid: Не получилось разобрать номер. Напишите его целиком, начиная с +7 или 8, либо нажмите «Пропустить».
  phone_not_yours: Это не ваш контакт. Нажмите «Поделиться контактом» или напишите свой номер.
  phone_saved: Телефон сохранён.
  phone_skipped: Хорошо, без телефона.
  back_to_email: Хорошо, вернёмся к почте.
  ask_consent: "Нажимая «Согласен», вы соглашаетесь на обработку персональных данных: {privacy_url}"
  done: |-
    Готово, {name}! Вы записаны на практикум {practicum_slot}, {platform}.
    За день до начала пришлю ссылку на подключение, за час — напоминание.
  already: Вы уже записаны на практикум {practicum_slot}. Ссылку пришлю за день до начала.
  cancelled: Запись отменена, данные не сохранены. Записаться можно в любой момент из меню.
  edit_cancelled: Изменения не сохранены. Вы по-прежнему записаны на практикум {practicum_date_short}.
  ask_role: "Необязательный вопрос: чем вы занимаетесь?"
  role_thanks: Спасибо!
  ics_caption: Откройте файл, чтобы добавить практикум в календарь.
  admin_new: "Новая запись на практикум: {name}, {email}, {phone}, {username}, источник: {source}. Всего записались: {count}."
  buttons:
    name_yes: Да, {name}
    email_keep: Оставить {email}
    back: Назад
    cancel: Отмена
    share_contact: Поделиться контактом
    skip: Пропустить
    agree: Согласен
    edit: Изменить данные
    calendar: Добавить в календарь
  roles:
    consultant: Независимый консультант
    opex: Lean/OpEx в компании
    transformation: Руководитель трансформации или PMO
    other: Другое
    skip: Пропустить
  ics:
    summary: "Практикум: {title}"
    description: |-
      Бесплатный практикум {author_name_genitive}, {practicum_slot}, {platform}.
      Ссылку на подключение бот пришлёт в Telegram за день до начала.
      Страница курса: {course_page}
    default_description: "{title}. Страница курса: {course_page}"


# --- admin.*, questions.* — TASK-BOT-002 -------------------------------------------------------

admin:
  # /stats. Строки списков ({by_day}, {by_source}, …) собирает app/services/stats.py.
  stats: |-
    Статистика записей

    Практикум: {practicum_total}{practicum_cancelled}
    По каналам: {by_channel}

    По дням за последние {days} дней, МСК:
    {by_day}

    Источники:
    {by_source}

    Заявки на курс: {course}

    Вопросы без ответа: {unanswered}
  stats_cancelled: " (и ещё {n} отменили)"
  stats_course: |-
    {total}
    по тарифам: {by_tariff}
    по статусам: {by_status}
  stats_course_empty: пока нет
  stats_other_sources: "другие — {n}"
  none: нет
  no_source: без метки
  no_tariff: без тарифа
  channels:
    bot: бот
    site: сайт
  statuses:
    registered: записан
    applied: заявка
    confirmed: подтверждена
    rejected: отклонена
    paid: оплачена
    cancelled: отменена
  # /export
  export_caption: "Записей: {count}. Время в файле — МСК."
  # /link, /set_link
  links: |-
    Ссылки практикума
    Трансляция: {join_url}
    Запись: {recording_url}

    Изменить: /link https://… или /set_link recording https://…
  link_missing: не задана
  link_saved: "Ссылка сохранена: {url}"
  link_bad: "Нужна ссылка, начинающаяся с https://, например: /link https://telemost.yandex.ru/j/…"
  set_link_usage: |-
    Формат:
    /set_link practicum https://… — ссылка на трансляцию практикума;
    /set_link recording https://… — ссылка на запись практикума.

questions:
  ask: Напишите вопрос одним сообщением.
  text_only: Напишите вопрос текстом, одним сообщением.
  escalated: Передал вопрос Александру, он ответит здесь же.
  # Владельцу. {details} — «@username, источник» (собирается в коде), {text} — вопрос как есть.
  to_admin: "Вопрос от {name}{details}:\n{text}"
  to_admin_bot_answer: "\n\nОтвет бота: {bot_answer}"
  no_name: без имени
  no_source: без метки
  admin_prompt: Напишите ответ для {name}.
  admin_prompt_again: Напишите ответ для {name}. На этот вопрос вы уже отвечали — новый ответ уйдёт как дополнение.
  admin_text_only: Ответ отправляется только текстом. Напишите его одним сообщением или нажмите «Отмена».
  admin_cancelled: Ответ отменён.
  sent: Отправлено.
  blocked: "Не доставлено: пользователь заблокировал бота"
  failed: "Не доставлено: Telegram вернул ошибку, попробуйте ещё раз."
  no_chat: "Не доставлено: у этого человека нет чата с ботом."
  not_found: Вопрос не найден.
  # Пользователю
  user_answer: "Ответ Александра:\n{text}"
  user_answer_more: "Дополнение от Александра:\n{text}"
  buttons:
    answer: Ответить
    cancel: Отмена


