name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - run: ruff check .

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (SQLite, без сети)
        run: pytest -q

  migrations:
    name: alembic on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: ai_native_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot -d ai_native_bot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bot:bot@localhost:5432/ai_native_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: upgrade → downgrade → upgrade
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (фиктивные обязательные переменные)
        env:
          BOT_TOKEN: dummy
          TELEGRAM_WEBHOOK_SECRET: dummy
          DATABASE_URL: postgresql+psycopg://bot:dummy@db:5432/ai_native_bot
          POSTGRES_PASSWORD: dummy
        run: docker compose -f docker-compose.coolify.yml config -q

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: .env не в индексе
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env закоммичен — удалите его из индекса и смените секреты"
            exit 1
          fi
      - name: токены в diff
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            range="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE...HEAD"
          else
            range="$(git rev-list --max-parents=0 HEAD | tail -n 1)...HEAD"
          fi
          echo "diff: $range"
          added="$(git diff --unified=0 "$range" | grep -E '^\+[^+]' || true)"
          found=0
          if printf '%s\n' "$added" | grep -qE '[0-9]{8,10}:[A-Za-z0-9_-]{35}'; then
            echo "::error::похоже на токен Telegram-бота"
            found=1
          fi
          if printf '%s\n' "$added" | grep -qE 'sk-[A-Za-z0-9]{20,}'; then
            echo "::error::похоже на API-ключ (sk-…)"
            found=1
          fi
          exit "$found"
